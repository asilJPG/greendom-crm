<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Склад: просмотр</title>
<style>
  :root { --bg:#f4f6f2; --card:#fff; --ink:#1b1f1a; --mut:#69705f; --ok:#2e7d32; --okbg:#e8f5e9; --warn:#b26a00; --bad:#b3261e; --badbg:#fdecea; --line:#dfe3da; --blue:#1a5fb4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12150f; --card:#1b1f17; --ink:#eef1ea; --mut:#9aa38f; --okbg:#1f3a22; --badbg:#3a1d1a; --line:#2e342a; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  [hidden] { display:none !important; }
  input, select, button { font:inherit; }
  input, select { padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); width:100%; min-width:0; }
  button { cursor:pointer; }
  .wrap { max-width:960px; margin:0 auto; padding:14px 14px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; overflow-x:auto; }
  h2 { margin:0 0 10px; font-size:14px; color:var(--mut); font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { padding:12px 18px; border-radius:10px; border:0; background:var(--ok); color:#fff; }
  .btn.sec { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.sm { padding:8px 12px; font-size:14px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .tab { padding:12px 18px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .tab.sel { background:var(--ok); color:#fff; border-color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td, th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .muted { color:var(--mut); } .small { font-size:13px; }
  .top { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .top .title { font-weight:600; font-size:19px; margin-right:auto; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--mut); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .banner { background:var(--badbg); color:var(--bad); border:1px solid var(--bad); border-radius:12px; padding:10px 14px; margin-top:10px; }
  .kpi { display:flex; gap:22px; flex-wrap:wrap; } .kpi b { font-size:22px; }
  .big { font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .gcard { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--card); }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:13px; }
  .b-in { background:var(--okbg); color:var(--ok); } .b-out { background:#e3edfb; color:var(--blue); } .b-writeoff { background:#fff3e0; color:var(--warn); }
  tr.cancelled td { color:var(--mut); text-decoration:line-through; }
  #login { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
  .err { color:var(--bad); min-height:22px; }
</style>
</head>
<body>

<div id="login" hidden>
  <h1 style="margin:0">Склад: просмотр</h1>
  <div class="card" style="width:min(360px,100%)">
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" style="margin-bottom:10px">
    <button class="btn" style="width:100%" id="go">Войти</button>
    <div class="err" id="lerr" style="margin-top:8px"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="title" id="title">Склад</div>
    <div class="small muted"><span class="dot" id="dot"></span><span id="seen">…</span></div>
    <button class="btn sec sm" id="logout">Выйти</button>
  </div>
  <div class="banner" id="stale" hidden>Моноблок давно не передавал данные. Цифры ниже могут быть неактуальны.</div>
  <div class="tabs" id="tabs">
    <button class="tab sel" data-tab="stock">Остатки</button>
    <button class="tab" data-tab="report">Отчёт</button>
    <button class="tab" data-tab="history">История</button>
  </div>

  <div id="p-stock">
    <div class="card"><h2>Всего на складе</h2><div class="big"><span id="total">0</span> <span class="muted" style="font-size:18px">кг</span></div></div>
    <div class="grid" id="stock-cards"></div>
    <div class="card" style="margin-top:12px"><h2>Таблица</h2>
      <table><thead><tr><th>Сорт</th><th class="n">Приход</th><th class="n">Продано</th><th class="n">Списано</th><th class="n">Остаток</th></tr></thead><tbody id="stock-rows"></tbody></table></div>
  </div>

  <div id="p-report" hidden>
    <div class="card"><div class="row">
      <input type="date" id="r-from" style="width:auto"> <span>—</span> <input type="date" id="r-to" style="width:auto">
      <button class="btn sec sm" data-range="0">Сегодня</button><button class="btn sec sm" data-range="6">7 дней</button><button class="btn sec sm" data-range="29">30 дней</button>
      <button class="btn sm" id="r-go">Показать</button></div></div>
    <div id="r-body"></div>
  </div>

  <div id="p-history" hidden>
    <div class="card"><div class="row">
      <select id="h-type" style="width:auto"><option value="">Все операции</option><option value="in">Приход</option><option value="out">Продажа</option><option value="writeoff">Списание</option></select>
      <input id="h-day" type="date" style="width:auto"><button class="btn sec sm" id="h-all">Все дни</button></div></div>
    <div class="card"><table><thead><tr><th>Время</th><th>Операция</th><th>Сорт</th><th class="n">Нетто, кг</th><th>Кому / кто</th><th class="n">Сумма</th></tr></thead><tbody id="h-rows"></tbody></table></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg = v => (v == null ? '—' : Number(v).toFixed(3));
const money = v => Number(v || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const shift = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
let cur = 'сум', tab = 'stock', timer = null;

async function api(path, opts) {
  const res = await fetch(path, opts); let data = null; try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { showLogin(); return { ok: false, data }; }
  return { ok: res.ok, data };
}
function showLogin() { clearInterval(timer); $('app').hidden = true; $('login').hidden = false; $('pw').value = ''; }
$('go').onclick = login; $('pw').onkeydown = e => { if (e.key === 'Enter') login(); };
async function login() {
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $('lerr').textContent = data.error || 'Ошибка'; return; }
  $('lerr').textContent = ''; start();
}
$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); showLogin(); };

async function start() {
  const r = await api('/api/status'); if (!r.ok) return;
  $('login').hidden = true; $('app').hidden = false;
  paintStatus(r.data); go(tab);
  clearInterval(timer); timer = setInterval(async () => { const s = await api('/api/status'); if (s.ok) paintStatus(s.data); if (tab === 'stock') loadStock(); }, 30000);
}
function paintStatus(d) {
  const dev = d.devices[0];
  if (!dev) { $('seen').textContent = 'данных от моноблока ещё не было'; $('dot').className = 'dot bad'; $('stale').hidden = true; return; }
  cur = dev.currency || 'сум';
  $('title').textContent = 'Склад' + (dev.crop ? ' · ' + dev.crop : '');
  const m = Math.floor(dev.seconds_ago / 60);
  $('seen').textContent = 'обновлено ' + (m < 1 ? 'только что' : m < 60 ? m + ' мин назад' : Math.floor(m / 60) + ' ч назад') + (dev.pending ? ` · в очереди ${dev.pending}` : '');
  const stale = dev.seconds_ago > 900;
  $('dot').className = 'dot ' + (stale ? 'bad' : 'ok'); $('stale').hidden = !stale;
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
function go(id) {
  tab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('sel', b.dataset.tab === id));
  ['stock', 'report', 'history'].forEach(p => $('p-' + p).hidden = p !== id);
  if (id === 'stock') loadStock();
  if (id === 'report') { if (!$('r-from').value) { $('r-from').value = iso(new Date()); $('r-to').value = iso(new Date()); } loadReport(); }
  if (id === 'history') loadHistory();
}
async function loadStock() {
  const r = await api('/api/stock'); if (!r.ok) return; const d = r.data;
  $('total').textContent = kg(d.total_kg);
  $('stock-cards').innerHTML = d.rows.map(x => `<div class="gcard"><div class="muted">${esc(x.grade)}</div><div class="big">${kg(x.balance_kg)}</div><div class="small muted">кг на складе</div></div>`).join('');
  $('stock-rows').innerHTML = d.rows.map(x => `<tr><td>${esc(x.grade)}</td><td class="n">${kg(x.in_kg)}</td><td class="n">${kg(x.out_kg)}</td><td class="n">${kg(x.writeoff_kg)}</td><td class="n"><b>${kg(x.balance_kg)}</b></td></tr>`).join('');
}
document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { $('r-from').value = shift(+b.dataset.range); $('r-to').value = iso(new Date()); loadReport(); });
$('r-go').onclick = loadReport;
async function loadReport() {
  const r = await api(`/api/report?from=${$('r-from').value}&to=${$('r-to').value}`); if (!r.ok) return; const d = r.data;
  const sum = k => d.by_grade.reduce((a, x) => a + x[k], 0), tOut = sum('out_kg'), tAmt = sum('amount');
  const tbl = (head, rows) => `<table><thead><tr>${head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="muted">Нет данных</td></tr>`}</tbody></table>`;
  $('r-body').innerHTML = `
   <div class="card"><div class="kpi"><div>Приход<br><b>${kg(sum('in_kg'))}</b> кг</div><div>Продано<br><b>${kg(tOut)}</b> кг</div><div>Выручка<br><b>${money(tAmt)}</b> ${esc(cur)}</div>
     <div>Средняя цена<br><b>${tOut ? money(tAmt / tOut) : '—'}</b> ${esc(cur)}/кг</div><div>Списано<br><b>${kg(sum('writeoff_kg'))}</b> кг</div></div>
     <div class="muted small" style="margin-top:8px">Ручных записей веса: ${d.manual_entries} · отменённых операций: ${d.cancelled_entries}</div></div>
   <div class="card"><h2>По сортам</h2>${tbl(['Сорт', 'Приход, кг', 'Продано, кг', 'Списано, кг', `Выручка, ${cur}`], d.by_grade.map(x => `<tr><td>${esc(x.grade)}</td><td class="n">${kg(x.in_kg)}</td><td class="n">${kg(x.out_kg)}</td><td class="n">${kg(x.writeoff_kg)}</td><td class="n">${money(x.amount)}</td></tr>`))}</div>
   <div class="card"><h2>По дням</h2>${tbl(['День', 'Приход, кг', 'Продано, кг', `Выручка, ${cur}`], d.by_day.map(x => `<tr><td>${esc(x.day)}</td><td class="n">${kg(x.in_kg)}</td><td class="n">${kg(x.out_kg)}</td><td class="n">${money(x.amount)}</td></tr>`))}</div>
   <div class="card"><h2>Кто сколько собрал</h2>${tbl(['Работник', 'Ящиков', 'Нетто, кг'], d.by_worker.map(x => `<tr><td>${esc(x.worker)}</td><td class="n">${x.crates}</td><td class="n">${kg(x.kg)}</td></tr>`))}</div>
   <div class="card"><h2>Покупатели</h2>${tbl(['Покупатель', 'Куплено, кг', `Сумма, ${cur}`], d.by_customer.map(x => `<tr><td>${esc(x.customer)}</td><td class="n">${kg(x.kg)}</td><td class="n">${money(x.amount)}</td></tr>`))}</div>`;
}
const TYPE = { in: ['Приход', 'b-in'], out: ['Продажа', 'b-out'], writeoff: ['Списание', 'b-writeoff'] };
$('h-type').onchange = loadHistory; $('h-day').onchange = loadHistory; $('h-all').onclick = () => { $('h-day').value = ''; loadHistory(); };
async function loadHistory() {
  const r = await api(`/api/movements?type=${$('h-type').value}&day=${$('h-day').value}&limit=200`); if (!r.ok) return;
  $('h-rows').innerHTML = r.data.map(m => {
    const [tn, tc] = TYPE[m.type]; const who = m.type === 'out' ? (m.customer || '') : m.type === 'in' ? (m.worker || '') : (m.note || '');
    return `<tr class="${m.status === 'cancelled' ? 'cancelled' : ''}"><td>${esc(m.ts.slice(5, 16))}</td><td><span class="badge ${tc}">${tn}</span></td><td>${esc(m.grade)}</td><td class="n">${kg(m.net_kg)}${m.manual ? ' *' : ''}</td><td>${esc(who)}${m.status === 'cancelled' ? ` <span class="small">(отмена: ${esc(m.cancel_reason || '')})</span>` : ''}</td><td class="n">${m.type === 'out' ? money(m.amount) : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">Записей нет</td></tr>';
}
(async () => { const r = await api('/api/status'); if (r.ok) start(); else showLogin(); })();
</script>
</body>
</html>
